name: Build Android Binary

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download Android NDK
      run: |
        wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
        unzip -q android-ndk-r25c-linux.zip
        
    - name: Compile Dynamic Binary
      run: |
        chmod +x ./android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin/*
        ./android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang -O2 -Wall -Wextra -fPIE -pie -o App_screen_off App_restrict.c
        
    - name: Upload Binary
      uses: actions/upload-artifact@v4
      with:
        name: App_screen_off
        path: App_screen_off
