name: Build Android Binary

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c
        add-to-path: true

    - name: Build static binary
      run: |
        aarch64-linux-android24-clang -O2 -Wall -Wextra -static -o App_screen_off App_restrict.c

    - name: Upload Binary
      uses: actions/upload-artifact@v4
      with:
        name: App_screen_off
        path: App_screen_off
